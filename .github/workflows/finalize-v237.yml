name: Finalize verified v2.3.7 candidate
on:
  push:
    branches: ['release/v2.3.7']
    paths: ['.github/workflows/finalize-v237.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/v2.3.7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify transport and reconstruct reviewed files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, shutil, subprocess, zlib
          root = Path.cwd()
          chunks = [(root/'.candidate-v237'/('part-'+str(i)+'.b64')).read_text().strip() for i in range(1,6)]
          # Repair only transport transcription, accepted solely with exact known digests.
          expected_first = '11d9182749bb12115df1ff03941e4031c7553a0fc1300c3fb39c9b92491325f1'
          if hashlib.sha256(chunks[0].encode()).hexdigest() != expected_first and len(chunks[0]) == 6004:
              candidates = [chunks[0][:i]+chunks[0][i+4:] for i in range(len(chunks[0])-3)]
              matches = [x for x in candidates if hashlib.sha256(x.encode()).hexdigest() == expected_first]
              if not matches: raise RuntimeError('Transport part 1 does not match reviewed bytes')
              chunks[0] = matches[0]
          if len(chunks[4]) == 4710:
              chunks[4] = chunks[4].replace('isbPKDKm', 'isbPKMJDKm')
          encoded = ''.join(chunks).encode()
          assert hashlib.sha256(encoded).hexdigest() == 'ba61f617b6213a6bc47be211b090578194a552a6ba90f1017df321a8621b6d0a', 'Transport checksum mismatch'
          raw = zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest() == '780b3fdacf415a313515e9f31a15259135a7cd70eff2abf3e092cbdaaa2e2879', 'Source checksum mismatch'
          doc = json.loads(raw)
          assert len(doc['sha256']) == 19
          for name in doc['sha256']:
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
          patch = Path('/tmp/amf237-reviewed.patch')
          patch.write_text(doc['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name, content in doc['binary'].items():
              assert name in ('assets/brand/audit-medias-icon-128.png','assets/brand/audit-medias-icon-256.png')
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(content,validate=True))
          for name, digest in doc['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest, name
          for name in ('.candidate-v237','.release-v237'):
              shutil.rmtree(root/name)
          for name in ('review-v237.yml','finalize-v237.yml'):
              (root/'.github/workflows'/name).unlink()
          print('VERIFIED: all 19 changed source files match the reviewed candidate exactly')
          PY
      - name: Syntax and behavioral regressions
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          node --check assets/admin.js
          php tests/updater-test.php
          php tests/ui-v237-test.php
          for v in 2.3.3 2.3.5 2.3.6 2.3.7; do php tests/transition-test.php "$v"; done
          php tests/transition-test.php 2.3.3 audit-medias-2.3.3/audit-medias.php
          for args in 'tab=files' 'tab=dashboard' 'tab=settings' 'tab=woo' 'tab=errors' 'tab=media' 'tab=files&no_woo=1' 'tab=files&readonly=1' 'tab=files&empty=1' 'tab=files&stale=1' 'tab=files&old_scan=1' 'tab=dashboard&running=1' 'tab=dashboard&no_scan=1' 'tab=settings&no_scan=1' 'tab=files&assoc=unassociated&other_usage=none' 'tab=files&xss=1' 'tab=settings&amf_update_checked=1&update_error=1' 'tab=files&usage=unused' 'tab=files&usage=unused&no_woo=1' 'tab=files&usage=unused&stale=1' 'tab=woo&type=variation&role=gallery'; do
            php tests/render-fixture.php "$args" > /dev/null
          done
          python3 tools/build-manifest.py --tag v2.3.7
          python3 tests/package-test.py
          python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('dist/audit-medias-v2.3.7.zip').read_bytes()).hexdigest() == '551672a3ee4fb75145715c9eaa497623f55e7e1758493b574f28041af0470ffd'"
      - name: Commit only verified source on release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: verified v2.3.7 presentation, filters and release notes'
          git push origin HEAD:refs/heads/release/v2.3.7
