name: Verifications du code
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP and JavaScript syntax
        run: |
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          node --check assets/admin.js
      - name: Static client, checksums and transition (simulated WordPress)
        run: |
          set -euo pipefail
          php tests/updater-test.php
          php tests/ui-v237-test.php
          python3 tests/ui-v238-test.py
          for v in 2.3.3 2.3.5 2.3.6 2.3.7; do php tests/transition-test.php "$v"; done
          php tests/transition-test.php 2.3.3 audit-medias-2.3.3/audit-medias.php
      - name: Interface fixtures (simulated WordPress)
        run: |
          set -euo pipefail
          for args in 'tab=files' 'tab=dashboard' 'tab=settings' 'tab=woo' 'tab=errors' 'tab=media' 'tab=files&no_woo=1' 'tab=files&readonly=1' 'tab=files&empty=1' 'tab=files&stale=1' 'tab=files&old_scan=1' 'tab=dashboard&running=1' 'tab=dashboard&no_scan=1' 'tab=settings&no_scan=1' 'tab=files&assoc=unassociated&other_usage=none' 'tab=files&xss=1' 'tab=settings&amf_update_checked=1&update_error=1' 'tab=files&usage=unused' 'tab=files&usage=unused&no_woo=1' 'tab=files&usage=unused&stale=1' 'tab=woo&type=variation&role=gallery'; do
            php tests/render-fixture.php "$args" > /dev/null
            printf 'PASS %s\n' "$args"
          done
      - name: Reproducible packages and manifest
        run: |
          set -euo pipefail
          python3 tools/build-manifest.py --tag "v$(php -r '$s=file_get_contents("audit-medias.php"); preg_match("/Version: ([0-9.]+)/",$s,$m); echo $m[1];')"
          python3 tests/package-test.py
