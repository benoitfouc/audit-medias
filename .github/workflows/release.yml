name: Publication du ZIP WordPress
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Syntax and regression checks
        run: |
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          node --check assets/admin.js
          php tests/updater-test.php
          php tests/render-fixture.php 'tab=settings&amf_update_checked=1' > /dev/null
      - name: Build the canonical WordPress ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/build-package.py --tag "$RELEASE_TAG"
      - name: Attach ZIP (never overwrite a distributed asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "dist/audit-medias-${RELEASE_TAG}.zip"
