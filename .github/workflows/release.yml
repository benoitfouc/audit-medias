name: Publication du ZIP et du manifeste statique
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag stable existant, par exemple v2.3.6'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: audit-medias-publication
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          find includes tools -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          php -l audit-medias.php
          node --check assets/admin.js
          php tests/updater-test.php
          php tests/transition-test.php 2.3.3
          php tests/transition-test.php 2.3.6
      - name: Publish immutable ZIP and static manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/publish-release.py --tag "$RELEASE_TAG"
