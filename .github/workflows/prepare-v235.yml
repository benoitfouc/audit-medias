name: Prepare verified 2.3.5 candidate
on:
  push:
    branches: [release/v2.3.5]
    paths: [.github/workflows/prepare-v235.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Reconstruct and verify each tested file
        run: |
          python3 <<'PY'
          import base64,hashlib,json,lzma,pathlib
          root=pathlib.Path('.')
          parts=sorted(root.glob('.amf-build-235/part-*.txt'))
          assert len(parts)==5, 'Incomplete payload'
          payload=''.join(p.read_text().strip() for p in parts)
          assert hashlib.sha256(payload.encode()).hexdigest()=='9a98f223f5c0ac267e779dd9ca1408916c93894739402ea9dcf152e955a1b42f', 'Payload differs from locally tested source'
          files=json.loads(lzma.decompress(base64.b64decode(payload,validate=True)))
          allowed={'README.txt','assets/admin-brand.css','assets/brand/benfou-logo.svg','assets/brand/benfou-mark.svg','audit-medias.php','docs/BRANDING.md','docs/RELEASE-2.3.5.md','docs/VALIDATION-2.3.5.md','includes/class-amf-admin.php','includes/class-amf-updates.php','tests/render-fixture.php','tests/updater-test.php','tools/build-package.py','tools/update-probe/benfou-amf-diagnostic.php'}
          assert set(files)==allowed
          pending={}
          for name,entry in files.items():
              path=root/name
              assert not path.is_symlink()
              if 'text' in entry:
                  data=entry['text'].encode('utf-8')
              else:
                  before=path.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==entry['base'], 'Unexpected base: '+name
                  lines=before.decode('utf-8').splitlines(keepends=True)
                  for start,end,replacement in reversed(entry['ops']):
                      assert 0<=start<=end<=len(lines)
                      lines[start:end]=replacement
                  data=''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==entry['sha256'], 'File integrity: '+name
              pending[path]=data
          for path,data in pending.items():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              print('VERIFIED',path,hashlib.sha256(data).hexdigest())
          def checked_text(name,expected):
              data=(root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected
              return data.decode('utf-8')
          readme=checked_text('README.md','4957e580180f1a8d84d6997de03e0c4746900c88')
          readme=readme.replace('version-2.3.4-4d7c00','version-2.3.5-C0FA39')
          readme=readme.replace('[Validation 2.3.4](docs/VALIDATION-2.3.4.md)','[Validation 2.3.5](docs/VALIDATION-2.3.5.md)')
          heading='## Mises à jour\n'
          readme=readme.replace(heading,'## Identité Benfou\n\nLogo original fourni par Benfou, interface claire noir/blanc et accent `#C0FA39`. Les alertes et suppressions gardent leurs couleurs de sécurité. Aucun chargement de police distante : Montserrat lorsqu’elle est disponible localement, sinon police système. [Détails](docs/BRANDING.md).\n\n'+heading)
          readme=readme.replace('renouvelle les métadonnées et ouvre l\'écran de mises à jour WordPress','renouvelle les métadonnées de mise à jour')
          readme=readme.replace('[Historique](CHANGELOG.md)','La **2.3.5** affiche un diagnostic dans les réglages : version locale, cache, réponse HTTP, quota GitHub et proposition enregistrée par WordPress. La vérification manuelle interroge aussi GitHub si le contrôle WordPress.org échoue auparavant. Cela ne prouve pas la cause d’un blocage sur un site donné.\n\n[Historique](CHANGELOG.md)')
          (root/'README.md').write_text(readme,encoding='utf-8')
          change=checked_text('CHANGELOG.md','e7b87da1518b1cfa80e798e33a54ee90de66cda4')
          entry='## 2.3.5 — 22 octobre 2026\n- Identité Benfou : logo original, noir/blanc et accent #C0FA39, styles limités aux écrans du plugin.\n- Diagnostic des mises à jour : cache, dates, HTTP, quota, erreurs et version proposée par WordPress.\n- Vérification manuelle GitHub même si WordPress.org échoue, sans installation forcée ni modification des autres offres.\n- Publication reproductible, tests renforcés et outil de diagnostic temporaire pour les anciennes installations.\n- Aucun changement du moteur, de la base, des suppressions ou des actions groupées.\n\n'
          (root/'CHANGELOG.md').write_text(change.replace('## 2.3.4',entry+'## 2.3.4',1),encoding='utf-8')
          PY
      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          node --check assets/admin.js
          php tests/updater-test.php
          for args in 'tab=files' 'tab=settings' 'tab=dashboard' 'tab=settings&amf_update_checked=1&update_error=1'; do php tests/render-fixture.php "$args" > /dev/null; done
          python3 tools/build-package.py --tag v2.3.5
      - name: Commit tested source on the release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.txt CHANGELOG.md audit-medias.php assets includes docs tests tools
          git commit -m 'feat: Benfou identity and update diagnostics (2.3.5)'
          git push origin HEAD:refs/heads/release/v2.3.5
