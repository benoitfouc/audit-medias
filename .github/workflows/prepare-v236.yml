name: Prepare verified 2.3.6 candidate
on:
  push:
    branches: [release/v2.3.6]
    paths: [.github/workflows/prepare-v236.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'benoitfouc/audit-medias'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Reconstruct the checksum-verified source
        run: |
          python3 <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          text = ''.join(Path('.release-236/part-%d.b64' % i).read_text().strip() for i in range(3))
          data = base64.b64decode(text, validate=True)
          assert hashlib.sha256(data).hexdigest() == '53dda73c9842e7a9ce1f73ae63e3df424206778231a600566b33e410a2012715'
          payload = json.loads(lzma.decompress(data))
          paths = []
          for name, item in payload['files'].items():
              p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.github' not in p.parts
              raw = item['text'].encode('utf-8')
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(raw)
              paths.append(name)
          for name, item in payload['edits'].items():
              p = Path(name)
              raw = p.read_bytes()
              blob = b'blob ' + str(len(raw)).encode() + b'\0' + raw
              assert hashlib.sha1(blob).hexdigest() == item['before'], name
              text = raw.decode('utf-8')
              for old, new in item['replace']:
                  assert text.count(old) == 1, (name, old)
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
              paths.append(name)
          Path('.release-236/paths.json').write_text(json.dumps(paths))
          print('Verified and reconstructed', len(paths), 'files')
          PY
      - name: Syntax, regression and integrity checks
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          node --check assets/admin.js
          php tests/updater-test.php
          for v in 2.3.3 2.3.5 2.3.6 2.3.7; do php tests/transition-test.php "$v"; done
          php tests/transition-test.php 2.3.3 audit-medias-2.3.3/audit-medias.php
          for args in 'tab=files' 'tab=dashboard' 'tab=settings' 'tab=woo' 'tab=errors' 'tab=media' 'tab=files&no_woo=1' 'tab=files&readonly=1' 'tab=files&empty=1' 'tab=files&stale=1' 'tab=files&old_scan=1' 'tab=dashboard&running=1' 'tab=dashboard&no_scan=1' 'tab=settings&no_scan=1' 'tab=files&assoc=unassociated&other_usage=none' 'tab=files&xss=1' 'tab=settings&amf_update_checked=1&update_error=1'; do
            php tests/render-fixture.php "$args" > /dev/null
          done
          python3 tools/build-manifest.py --tag v2.3.6
          python3 tests/package-test.py
          echo '736e8eb659b952b9c44c4646aeefc503685f030f76ba11200a090796da67ff55  dist/audit-medias-v2.3.6.zip' | sha256sum --check
      - name: Commit verified files on the release branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/v2.3.6'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -c 'import json,subprocess;from pathlib import Path;subprocess.run(["git","add","--"]+json.loads(Path(".release-236/paths.json").read_text()),check=True)'
          git commit -m 'fix: static update channel and secure transition (2.3.6)'
          git push origin HEAD:refs/heads/release/v2.3.6
